name: Update data and deploy

# Two runs a day on weekdays:
#   06:00 UTC — the morning brief, before the European day gets going.
#   18:30 UTC — after ICE US has closed, so the evening edition carries the
#               day's settlement rather than a mid-session price.
# Times are UTC and GitHub may delay scheduled runs under load.
#
# KEEP IN STEP WITH `SCHEDULE` in scripts/fetch-data.mjs. That constant is
# published in the payload so the page can tell a quiet weekend from a broken
# pipeline; if these two disagree, the page raises a false alarm or misses a
# real one.
#
# GitHub disables scheduled workflows after 60 days of repository inactivity,
# and pushes made by this job's own token do not reliably count as activity.
# If the schedule stops, the page says so within a day — see the staleness
# banner — and re-enabling it is a button on the Actions tab.
on:
  schedule:
    - cron: '0 6 * * 1-5'
    - cron: '30 18 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

# Never let two runs write the data file at once.
concurrency:
  group: coffee-desk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # A hung fetch should fail, not sit there burning the account's minutes.
    # The whole run takes well under a minute in practice.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No dependencies by design: the fetch script uses only Node built-ins,
      # so there is nothing to install and nothing to audit. The test runner is
      # built into Node too, so this needs no install step either.
      - name: Test
        run: node --test

      # The pipeline validates what it fetched and exits non-zero rather than
      # write a payload that fails its own checks. When that happens nothing is
      # committed and the deploy below never runs, so the previous edition
      # stays live — yesterday's figures, clearly dated, beat today's wrong ones.
      - name: Fetch market data
        run: node scripts/fetch-data.mjs

      - name: Commit refreshed data
        run: |
          git config user.name "coffee-desk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # ico-history.json accumulates a month at a time and every run starts
          # from a fresh checkout, so it has to be committed or the record
          # resets to whatever the newest report happens to restate.
          git add data/latest.json data/ico-history.json
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Data refresh: $(date -u '+%Y-%m-%d %H:%M UTC')"
            # Rebase rather than force: the history of this file is the audit trail.
            git pull --rebase --autostash origin main
            git push
          fi

      - uses: actions/configure-pages@v5

      # Publish the site, not the repository. Uploading '.' put scripts/,
      # CLAUDE.md and .github/ on the public web — harmless in a public repo,
      # but there is no reason for the build tooling to be served as content.
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -r assets data _site/
          # data/manual holds hand-entry templates the page never fetches.
          rm -rf _site/data/manual

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
